<title>The Last Hour</title>
<script>
/* Live site: the page itself can be cached for a while after a publish, while maps.js etc. come fresh, so an old page
   could show new data. version.txt holds the build stamp; if it differs, load the page again under a new URL.
   BUILD stays 'dev' in the project; stamp_build.py writes the stamp into dist/index.html and dist/version.txt. */
(function(){var BUILD='20260929134336';if(BUILD==='dev'||window!==window.top||!window.fetch||location.protocol==='file:') return;
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(v){
    v=(v||'').trim();if(!v||v===BUILD) return;
    try{var k='lh-build-'+v;if(sessionStorage.getItem(k)) return;sessionStorage.setItem(k,'1')}catch(e){return}
    var u=new URL(location.href);u.searchParams.set('b',v);location.replace(u.href)}).catch(function(){})})();
</script>
<script>
/* Desktop / Steam: the game gets its own no-scroll desktop layout (html.desk). The page hosts it in a frame with a
   fixed desktop canvas, 900 px tall and at least 1440 wide (wider on wide screens), scaled to fill the monitor
   (1920x1080 -> 1600x900 at 1.2x; 1280x800 -> 1440x900 at 0.89x). */
/* ?diag=1 shows what the page detected about this screen (for tuning phones, foldables and tablets) */
(function(){if(!/[?&]diag=1/.test(location.search)||window!==window.top) return;
  var NL=String.fromCharCode(10);
  var show=function(){var f=document.getElementById('stage'),d=document.getElementById('lhdiag');
    if(!d){d=document.createElement('pre');d.id='lhdiag';d.style.cssText='position:fixed;left:6px;bottom:6px;z-index:9999;margin:0;padding:6px 8px;background:rgba(0,0,0,.85);color:#9f9;font:12px/1.35 monospace;border-radius:6px;pointer-events:none;white-space:pre';document.body.appendChild(d)}
    var lines=['mode '+(f?(f.src.indexOf('desk=1')>0?'DESKTOP frame':'TABLET frame'):'DIRECT page'),
      'window '+innerWidth+'x'+innerHeight+' dpr '+devicePixelRatio,'screen '+screen.width+'x'+screen.height,
      'coarse '+matchMedia('(pointer:coarse)').matches+' anyFine '+matchMedia('(any-pointer:fine)').matches+' touchPts '+navigator.maxTouchPoints,
      'fullscreen '+!!document.fullscreenElement,navigator.userAgent.slice(0,90)];
    try{if(f){var w=f.contentWindow;lines.push('frame '+f.style.width+' '+f.style.transform,'inner '+w.innerWidth+'x'+w.innerHeight+' phoneLayout '+w.matchMedia('(orientation:landscape) and (max-height:540px)').matches+' desk '+w.document.documentElement.classList.contains('desk'))}}catch(e){lines.push('frame err '+e.message)}
    d.textContent=lines.join(NL)};
  document.addEventListener('DOMContentLoaded',function(){show();setInterval(show,1000)});
})();
(function(){
  var inFrame=window!==window.top||/[?&]frame=1/.test(location.search);
  if(inFrame){document.documentElement.classList.add('inframe');if(/[?&]desk=1/.test(location.search)) document.documentElement.classList.add('desk');return}
  // a touchscreen with no mouse or trackpad (Chrome's "desktop site" mode on big Android screens can hide pointer:coarse)
  var touch=matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(any-pointer:fine)').matches)||/[?&]tablet=1/.test(location.search);
  var isSmall=function(){return Math.min(window.innerWidth,window.innerHeight)<=540||(window.innerWidth<window.innerHeight&&window.innerWidth<=600)};
  // folding or unfolding a phone crosses between the phone page and the big-screen frame: reload once to switch (the game is saved)
  var typing=function(){try{var a=document.activeElement;if(a&&a.tagName==='IFRAME'&&a.contentDocument) a=a.contentDocument.activeElement;return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))}catch(e){return false}};   // the on-screen keyboard shrinks the page
  // on touch screens only a real fold/unfold counts: the screen itself changes size. Rotating, or going full screen, only
  // swaps or trims the window, and reloading then would drop full screen (and loop back to the full-screen button)
  var scrMin=function(){return Math.min(screen.width||0,screen.height||0)};
  var watch=function(wasSmall){var t=0,s0=scrMin();window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){
    if(typing()||isSmall()===wasSmall) return;
    if(touch&&Math.abs(scrMin()-s0)<60) return;
    location.reload()},800)})};
  if(isSmall()){watch(true);return}                   // phones and small windows use the page directly
  watch(false);
  // big touch screens (an unfolded foldable, a tablet) get the phone layout, scaled up; mouse screens get the desktop layout
  var TAB=touch;
  var src=location.href.replace(/#.*$/,'');src+=(src.indexOf('?')<0?'?':'&')+(TAB?'frame=1':'frame=1&desk=1');
  document.write('<style>html,body{margin:0;height:100%;overflow:hidden;background:#0e0d0b}'+
    '#stage{position:fixed;left:0;top:0;border:0;display:block;background:#0e0d0b;transform-origin:0 0}'+
    '#tabgate{display:none;position:fixed;inset:0;z-index:5;background:#0d0c0a;color:#ece4cf;align-items:center;justify-content:center;text-align:center;font-family:Georgia,serif}'+
    '#tabgate.on{display:flex}#tabgate p{font-size:2rem;margin:0 0 18px}#tabgate button{font:600 1.2rem Georgia,serif;padding:14px 34px;border-radius:999px;border:0;background:#6fb3a1;color:#0d1311}'+
    '#tabgate small{display:block;color:#8d8570;margin-top:14px;font-size:.95rem}'+
    '#lhrot{display:none;position:fixed;inset:0;z-index:6;background:#0d0c0a;color:#ece4cf;align-items:center;justify-content:center;text-align:center;font:1.5rem Georgia,serif}'+
    '@media (orientation:portrait){#lhrot{display:flex}}'+
    '#lhrot i{display:block;width:56px;height:94px;border:3px solid #ece4cf;border-radius:11px;margin:0 auto 20px;animation:lhrot 2.4s ease-in-out infinite}'+
    '@keyframes lhrot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}</style>'+
    '<iframe id="stage" title="The Last Hour" allow="fullscreen" src="'+src.replace(/"/g,'&quot;')+'"></iframe>'+
    (TAB?'<div id="tabgate"><div><p>The Last Hour</p><button id="tabfs">Play in full screen</button><small>Best played sideways, in full screen.</small></div></div>'+
      '<div id="lhrot" aria-hidden="true"><div><i></i>Turn your device sideways to play</div></div>':''));
  function fit(){
    var f=document.getElementById('stage');if(!f) return;
    // while someone types in the game (a note), the on-screen keyboard shrinks the page: don't refit under them
    try{var ae=f.contentDocument&&f.contentDocument.activeElement;if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&f.style.width) return}catch(e){}
    var W=window.innerWidth,H=window.innerHeight,h=TAB?536:900,minW=TAB?700:1440,z=H/h,w=W/z;
    if(w<minW){w=minW;z=W/w;}                        // narrower than the layout needs: letterbox top and bottom
    w=Math.floor(w);f.style.width=w+'px';f.style.height=h+'px';
    // scale with a transform: changing CSS zoom on a live frame doesn't reliably reach the page inside
    f.style.transform='translate('+Math.round((W-w*z)/2)+'px,'+Math.round((H-h*z)/2)+'px) scale('+z+')';
  }
  window.addEventListener('resize',fit);
  if(window.ResizeObserver) document.addEventListener('DOMContentLoaded',function(){new ResizeObserver(fit).observe(document.documentElement)});
  var lastWH='';setInterval(function(){var k=window.innerWidth+'x'+window.innerHeight;if(k!==lastWH){lastWH=k;fit()}},500);   // safety net for hosts that skip resize events
  document.addEventListener('DOMContentLoaded',function(){fit();var f=document.getElementById('stage');f.addEventListener('load',function(){f.focus()});});
  document.addEventListener('mousedown',function(){var f=document.getElementById('stage');if(f) f.focus()});
  if(TAB){
    var gate=function(){var g=document.getElementById('tabgate');if(g) g.classList.toggle('on',!!document.fullscreenEnabled&&!document.fullscreenElement)};
    document.addEventListener('fullscreenchange',gate);document.addEventListener('DOMContentLoaded',function(){gate();
      document.getElementById('tabfs').addEventListener('click',function(){document.documentElement.requestFullscreen().then(function(){if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){})}).catch(function(){}).then(gate)})});
  }
  // the game asks the page to toggle fullscreen (its own frame can't fill the screen with the right scale)
  window.addEventListener('message',function(e){
    if(e.data!=='lh-fullscreen') return;
    if(document.fullscreenElement) document.exitFullscreen().catch(function(){});
    else document.documentElement.requestFullscreen().catch(function(){});
  });
  document.write('<plaintext style="display:none">');   // the rest of this file is the game itself, loaded in the frame
})();
</script>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe3db; --paper:#eef0ea; --paper2:#e6e9e1; --ink:#1c2420; --muted:#5a6660; --rule:#bcc5bd;
  --verdigris:#2d6b5f; --verdigris-ink:#f2f6f2; --seal:#9b1d2a; --seal-hi:#c2404a; --heart:#9b1d2a;
  --shadow:0 1px 0 rgba(20,40,30,.06),0 10px 24px -16px rgba(20,40,30,.45);
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --num:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --body:"Alegreya","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111615; --paper:#1a211f; --paper2:#161c1a; --ink:#e2e7e0; --muted:#98a59e; --rule:#2e3935;
    --verdigris:#72b3a4; --verdigris-ink:#0d1413; --seal:#b8323d; --seal-hi:#dd5a62; --heart:#e0575f;
    --shadow:0 10px 24px -14px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#111615; --paper:#1a211f; --paper2:#161c1a; --ink:#e2e7e0; --muted:#98a59e; --rule:#2e3935;
  --verdigris:#72b3a4; --verdigris-ink:#0d1413; --seal:#b8323d; --seal-hi:#dd5a62; --heart:#e0575f;
  --shadow:0 10px 24px -14px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* title */
.title-screen{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;padding:32px 0}
.glass{width:84px;height:120px;margin:0 0 20px}
.title-screen h1{font-size:clamp(3rem,15vw,4.6rem);letter-spacing:-.01em}
.title-screen h1 i{display:block;font-size:.42em;color:var(--muted);margin-bottom:.2em}
.lede{font-size:1.1rem;max-width:32ch;margin:18px 0 28px}
.stack{display:grid;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:500}
.btn.primary{background:var(--verdigris);border-color:var(--verdigris);color:var(--verdigris-ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:var(--rule)}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--verdigris);text-decoration:underline;text-underline-offset:3px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.top .era{min-width:0}
.top .era b{display:block;font-family:var(--display);font-weight:400;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .era span{font-size:.8rem;color:var(--muted)}
.hearts{display:flex;gap:3px;flex:none}
.hearts svg{width:20px;height:20px}

main{padding:16px 0 calc(150px + env(safe-area-inset-bottom,0px))}

/* bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:8px}
.actionbar .prog{font-size:.88rem;color:var(--muted);line-height:1.3}
.actionbar .prog b{color:var(--ink);font-weight:700}
.actionbar .btn{min-height:44px;padding:8px 16px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto}
.tab{background:none;border:0;padding:6px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted);min-height:52px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--verdigris);border-radius:2px}

/* scenes */
.scene{background:var(--paper);border-radius:14px;padding:16px 16px 14px;margin:0 0 14px;box-shadow:var(--shadow);border-left:3px solid var(--rule)}
.scene.done{border-left-color:var(--seal)}
.scene header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.scene h3{font-size:1.25rem}
.scene .num{font-family:var(--display);font-style:italic;color:var(--muted);font-size:.95rem;flex:none}
.scene p{margin:.45em 0;line-height:1.75}
.chip{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;border:1px solid var(--rule);background:var(--paper2);border-radius:999px;padding:1px 9px 1px 2px;font-size:.9rem;line-height:1.3;margin:0 1px;min-height:28px}
.chip .thumbwrap{border-radius:50%}
.chip.sealed{border-color:var(--seal);}
.chip em{font-style:normal;color:var(--muted)}
.intro-card{padding:4px 2px 14px}
.intro-card p{color:var(--muted);font-style:italic}

/* faces */
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:480px){.faces{grid-template-columns:repeat(4,1fr)}}
.face{position:relative;background:var(--paper);border:1px solid transparent;border-radius:14px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow);min-width:0}
.face .pt{width:100%;height:auto;max-width:92px;border-radius:10px}
.face .n{font-family:var(--display);font-size:1.05rem;margin-top:4px}
.face .who{font-size:.8rem;line-height:1.25;min-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.face .how{font-size:.74rem;color:var(--muted);line-height:1.2}
.face.filled{border-color:var(--verdigris)}
.face .wax{position:absolute;top:4px;right:4px;width:30px;height:30px}
.face .kin{position:absolute;top:6px;left:8px;font-size:.9rem}
.face.fresh .wax{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.face.fresh .wax{animation:none}}

/* manifest */
.tier{margin:0 0 18px}
.tier h3{font-size:1.2rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dotted var(--rule)}
.row .nm{font-weight:500}
.row .meta{font-size:.84rem;color:var(--muted)}
.row .right{text-align:right;font-size:.84rem;color:var(--muted);flex:none}
.row.done .nm{text-decoration:line-through;text-decoration-color:var(--seal);text-decoration-thickness:2px}
.doc{background:var(--paper);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin:0 0 16px}
.doc h3{font-size:1.2rem;margin-bottom:4px}

/* records */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dotted var(--rule)}
.item .ic{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;color:#fff}
.item .tx{flex:1;min-width:0}
.item .tx b{font-weight:700}
.item .btn{min-height:40px;padding:6px 14px;font-size:.92rem;flex:none}
.rar-c{background:#6d7a73}.rar-r{background:#2d6b5f}.rar-l{background:#8a6a1e}
.section-h{font-family:var(--display);font-size:1.3rem;margin:18px 0 4px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:94dvh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head{align-items:flex-start}
.sheet-head h2{font-size:1.7rem}
.sheet label{display:block;font-size:.86rem;color:var(--muted);margin:14px 0 4px}
.sheet select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--rule);background:var(--paper2);padding:8px 12px;font-size:1rem}
.note{background:var(--paper2);border-left:3px solid var(--verdigris);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.seen{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seen .btn{min-height:36px;padding:4px 12px;font-size:.88rem}
.close-row{display:flex;gap:10px;margin-top:18px}
.sheet .afield ~ .close-row,.sheet .note ~ .close-row{margin-top:30px}
.sheet.tightbtns .close-row{margin-top:10px}   /* killer field shown, or 3+ rows of memories: keep the buttons close */
.close-row .btn{flex:1}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pickgrid button{background:var(--paper2);border:1px solid var(--rule);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-family:var(--display)}
.pickgrid .pt{width:100%;height:auto;border-radius:8px}

/* reward & screens */
.screen{padding:28px 0 60px}
.kicker{color:var(--muted);font-style:italic;font-family:var(--display);font-size:1.05rem}
.screen h1{font-size:clamp(2.2rem,9vw,3rem);margin:4px 0 12px}
.boon{width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:16px;padding:14px 16px;margin:0 0 12px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.boon:hover{border-color:var(--verdigris)}
.boon h3{font-size:1.3rem}
.boon .tag{font-size:.8rem;color:var(--muted)}
.road{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.road span{font-size:.84rem;border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.road span.now{border-color:var(--verdigris);color:var(--verdigris)}
.fate{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dotted var(--rule)}
.fate .pt{border-radius:10px;flex:none}
.fate b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px}
.stats div{background:var(--paper);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stats b{display:block;font-family:var(--display);font-size:2rem;font-weight:400}
.stats span{font-size:.8rem;color:var(--muted)}
.rules li{margin:.4em 0}
.rules{padding-left:1.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:90vw;font-size:.95rem;box-shadow:var(--shadow)}
.center-modal{align-items:center;padding:20px}
.center-modal .sheet{border-radius:20px;padding-bottom:20px}

/* tableau & roster */
.tableau{position:relative;line-height:0;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #2a2722}
.asc{position:relative;overflow:hidden;background:#0b0a0d;width:100%;line-height:0}
.asc pre{position:absolute;top:0;left:0;margin:0;transform-origin:0 0;font:600 10px/10px "IBM Plex Mono","Courier New",Courier,monospace;letter-spacing:0;white-space:pre;color:#555;-webkit-text-size-adjust:none;text-size-adjust:none}
.thumbwrap{display:inline-block;flex:none;border-radius:6px;overflow:hidden;vertical-align:middle;background:#0b0a0d;line-height:0}
.thumbwrap .asc{height:100%}
.bust{width:calc(100% + 36px);margin:-10px -18px 14px;overflow:hidden}
.bleed{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0}

.zoombtn{min-height:38px;padding:4px 14px;font-size:.9rem}
.sketchtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.pcard{position:relative;display:flex;flex-direction:column;background:#17150f;border:2px solid #24211c;border-radius:10px;overflow:hidden;padding:0 0 6px;text-align:left;color:#ece4cf;min-width:0}
.pcard.filled{border-color:var(--verdigris)}
.pcard.sealed{border-color:#24211c}
/* a solved person turns black and white (freshly sealed ones fade to grey) */
.pcard.sealed .pix{filter:grayscale(1) contrast(1.05)}
.pcard.sealed.fresh .pix{animation:lh-grey 1.4s ease-out both}
@keyframes lh-grey{from{filter:grayscale(0)}to{filter:grayscale(1) contrast(1.05)}}
.pcard .pname{font-size:.78rem;line-height:1.2;padding:5px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pfate{font-size:.7rem;line-height:1.2;padding:1px 7px 0;color:#a59c85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num.corner{left:auto;right:auto;top:6px;left:6px;transform:none}
.wax-pin.corner{top:4px;left:4px;transform:none}
.wax-pin.corner.fresh{animation:stamp2 .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp2{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.unseen{position:absolute;top:9px;right:8px;width:9px;height:9px;border-radius:50%;background:#e0b040;box-shadow:0 0 0 2px #0b0a0d}
.membust{position:relative;margin:0 -16px 14px;border-bottom:1px solid #2a2722}
@media (min-width:600px){.membust{margin:0 auto 16px;max-width:420px;border:1px solid #2a2722;border-radius:12px;overflow:hidden}}
.num.big{top:10px;left:12px;transform:none;font-size:16px;padding:4px 9px 3px}
.story p{font-size:1.1rem;line-height:1.8;margin:0 0 1em}
.story .chip{margin:0 2px}
.present{display:flex;flex-wrap:wrap;gap:6px}
.satch{border-color:var(--seal);margin-top:4px}
.guess{color:#8d8a80;font-style:italic;font-weight:400}
.known{font-weight:700}
.pcard .pname.known{color:#f3ecd8}
.pickgrid .pl{font-family:var(--body);font-size:.72rem;line-height:1.2;padding:2px 2px 0;text-align:center;word-break:break-word}
.blindph{width:100%;aspect-ratio:1/1;display:grid;place-items:center;background:#0b0a0d;color:#3a3630;font:600 2rem var(--display)}
.thumbwrap .blindph{font-size:.8rem;height:100%}
.kinmark{position:absolute;bottom:40px;right:8px;font-size:1rem;text-shadow:0 0 3px #000}
.cine{position:fixed;inset:0;z-index:75;background:#060506;color:#ece4cf;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);cursor:pointer;user-select:none;-webkit-user-select:none}
.cinetop{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-family:var(--display);color:#8d8570;font-size:1.05rem}

.cinectl{min-height:38px;padding:4px 14px;font-size:.9rem}

.cinecap{max-width:640px;margin:0;padding:0 4px;font-size:1.22rem;line-height:1.55;text-align:center}
.cinecap.sound{font-style:italic;color:#d2c8ae;font-size:1.35rem}
.cname{font-weight:700;color:#fff4d8}
.cports{display:flex;gap:10px;justify-content:center;width:100%}

.cports.n2 .cport{width:min(44vw,36vh,320px)}
.cropwin{aspect-ratio:56/48;overflow:hidden;border-radius:10px;background:#111}
.cropwin img{width:100%;display:block;image-rendering:pixelated}
.cnum{position:absolute;top:8px;left:8px;background:rgba(6,5,6,.82);border:1px solid #4a4538;color:#ece4cf;font:13px/1.2 var(--body);padding:3px 8px;border-radius:999px}
.cinenav{display:flex;align-items:center;gap:8px;padding:0 10px}
.cinectl2{background:none;border:1px solid #3a362e;color:#ece4cf;border-radius:8px;width:40px;height:40px;font-size:1.4rem;line-height:1;flex:none}
.segs{flex:1;display:flex;gap:3px;height:28px;align-items:center}

.seg.done{background:#7a3a30}.seg.now{background:var(--seal-hi);height:10px}
.seg:hover{background:#5a5040}

/* ---- phones: portrait asks to rotate; landscape gets a compact layout ---- */
#rotate{display:none}
.topact{display:none}
@media (orientation:portrait) and (pointer:coarse) and (max-width:600px){
  #rotate{display:flex;position:fixed;inset:0;z-index:200;background:#0d0c0a;color:#ece4cf;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:1.3rem}
  .rotphone{width:46px;height:78px;border:3px solid #ece4cf;border-radius:9px;margin:0 auto 18px;animation:lh-rot 2.4s ease-in-out infinite}
}
@keyframes lh-rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:landscape) and (max-height:540px){
  :root{--topH:44px;--rail:62px}
  .wrap{max-width:none}
  .top .wrap{min-height:var(--topH);padding:0 10px 0 calc(var(--rail) + 10px);gap:10px}
  .top .era b{font-size:.95rem;display:inline}
  .top .era span{font-size:.72rem;margin-left:8px}
  .hearts svg{width:15px;height:15px}
  .topact{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
  .tprog{font-size:.78rem;color:var(--muted);white-space:nowrap}
  .tprog b{color:var(--ink)}
  .tbtn{min-height:32px!important;padding:3px 12px!important;font-size:.8rem!important}
  .tfs{padding:3px 9px!important;font-size:1rem!important}
  .actionbar{display:none}
  .dock{top:0;bottom:0;right:auto;width:var(--rail);border-top:0;border-right:1px solid var(--rule);padding-bottom:0;display:flex;align-items:center}
  .tabs{display:flex;flex-direction:column;gap:6px;width:100%}
  .tab{min-height:0;padding:8px 0;font-size:.62rem}
  .tab svg{width:22px;height:22px}
  main{padding:8px 0 8px var(--rail)}
  .ghead{display:none}
  /* cards: the picture fills the card; name and fate sit on it as a caption, only when there is one */
  .pcard{padding:0}
  .pcard .pix.full{height:100%}
  .pcard .pname,.pcard .pfate{position:absolute;left:0;right:0;padding-left:8px;padding-right:8px;text-shadow:0 1px 2px #000}
  .pcard .pname{bottom:18px;padding-top:4px;background:rgba(0,0,0,.72);color:#f3ecd8}
  .pcard .pname .guess{color:#d8cfb6}
  .pcard .pfate{bottom:0;padding-bottom:5px;background:rgba(0,0,0,.7)}
  .pcard .pname:empty,.pcard .pfate:empty{display:none}
  .pcard .pfate:empty ~ .x,.pcard:has(.pfate:empty) .pname{bottom:0;padding-bottom:5px}
  /* swipe a page of four at a time: 1-4, then 5-8 with 9 peeking in */
  .pgrid > .pcard{scroll-snap-align:none}
  .pgrid > .pcard:nth-child(4n+1){scroll-snap-align:start;scroll-snap-stop:always}
  /* rail: The Dead and Manifest at the top, Records at the bottom, clear of a camera cutout */
  .dock{align-items:stretch;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px)) 0}
  .tabs{height:100%}
  .tab[data-tab="satchel"]{margin-top:auto}
  /* hierarchy chart: one row per station, faces in a swipeable line */
  .scrim:has(.sheet.chart){padding:0;align-items:stretch;justify-content:stretch}
  .scrim .sheet.chart{position:relative;max-width:none;width:100vw;height:100dvh;max-height:none;border-radius:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .scrim .sheet.chart > h2{font-size:1.2rem!important;margin:0 0 4px}
  .scrim .sheet.chart > p.muted{display:none}
  .scrim .sheet.chart .close-row{position:absolute;top:6px;right:10px;margin:0}
  .scrim .sheet.chart .close-row .btn{min-height:32px;padding:3px 14px}
  .scrim .sheet.chart .tierrow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .scrim .sheet.chart .tierlbl{flex:0 0 118px;margin:0;font-size:.9rem;line-height:1.15}
  .scrim .sheet.chart .tierfaces{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .scrim .sheet.chart .tierfaces::-webkit-scrollbar{display:none}
  .scrim .sheet.chart .tface{flex:none}
  /* title screen: title on the left, text and buttons on the right */
  .title-screen{flex-direction:row;align-items:center;gap:40px;padding:12px 48px;max-width:980px}
  .title-screen .tleft{flex:1}
  .title-screen .tright{flex:1;max-width:400px}
  .title-screen h1{font-size:clamp(2.4rem,7vw,3.6rem)}
  .title-screen .lede{margin:0 0 14px}
  /* the dead: one swipeable row, about 4.5 cards in view, each filling the height */
  .pgrid{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    height:calc(100dvh - var(--topH) - 18px);padding-bottom:2px;scrollbar-width:none}
  .pgrid::-webkit-scrollbar{display:none}
  .pcard{flex:0 0 calc((100vw - var(--rail) - 60px) / 4.5);height:100%;scroll-snap-align:start}
  .pcard .pix.full{flex:1;min-height:0;height:auto;aspect-ratio:auto;object-fit:cover;object-position:50% 6%}
  /* character card: portrait on the left, everything else scrolls beside it */
  .scrim{align-items:center}
  .sheet{max-width:880px;max-height:96dvh;border-radius:16px}
  .sheet:has(> .bust){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-content:start}
  .sheet:has(> .bust) > *{grid-column:2}
  .sheet:has(> .bust) > .grab{display:none}
  .sheet > .bust{grid-column:1!important;grid-row:1 / span 40;margin:0!important;position:sticky;top:0;align-self:start}
  .sheet .bust .pix.full{height:calc(96dvh - 36px)!important}
  .membust .pix.full{height:calc(100dvh - 90px)}
  /* memory playback: text beside the portraits, portraits sized to the height */
  .cinestage{flex-direction:row;gap:24px}
  .cinecap,.cinetitle{flex:1;max-width:44%}
  .cine .cports .cfull,.cine .cports.n2 .cfull{height:calc(100dvh - 128px)}
  .cnum{top:auto;bottom:6px;left:6px;font-size:11px;padding:2px 7px}
  .cports{width:auto;flex:none}
  .cport{flex:none}
  .cinetop{padding:4px 12px}
  .cinehint{margin:2px 0 4px}
}

function addDetails(era,E,k,source){
  era.scenes.forEach(s=>{
    const pool=R.shuffle(s.present.slice());
    for(let i=0;i<k&&i<pool.length;i++){

    case 'gnclear':{const inp=document.querySelector('.gnin');ui.gDraft={v:inp?inp.value:'',c:null};render();break}
    case 'gnamed':ui.gDraft=Object.assign({},ui.gDraft,{c:b.dataset.v===''?null:+b.dataset.v});ui.pick=null;render();break;
    case 'gnotedel':S.era.gnotes.splice(+b.dataset.i,1);save();render();break;
    case 'tagged':{const {tk,f}=ui.pick,p=pnote(f),v=tagConv(tk,b.dataset.v),i=p[tk].indexOf(v);
      if(i>=0) p[tk].splice(i,1);else p[tk].push(v);
      b.classList.toggle('on',i<0);save();break}   // just this tile changes: no redraw, so no flash and the page stays put (Done redraws the notes)
    case 'untag':{const p=pnote(+b.dataset.f),k=b.dataset.k,v=tagConv(k,b.dataset.v),i=p[k].indexOf(v);if(i>=0) p[k].splice(i,1);save();render();break}
    case 'addnote':addNote(+b.dataset.f);break;
    case 'delnote':pnote(+b.dataset.f).custom.splice(+b.dataset.i,1);save();render();break;
    case 'memtab':ui.memTab=b.dataset.t;ui.notesNot=false;ui.markMode=null;if(b.dataset.t==='notes') ui.notesPulse=null;render();{const el=document.querySelector('.mtab.on');if(el) el.scrollTop=0}break;
    case 'openpick':ui.pick={kind:b.dataset.kind,f:+b.dataset.f};render();{const pb=document.querySelector('.picker .ptile.on');if(pb) pb.scrollIntoView({block:'center'})}break;
    case 'picked':{const {kind,f}=ui.pick;ui.pick=null;setAnswer(f,kind,b.dataset.v===''?null:b.dataset.v);break}
    case 'closepick':ui.pick=null;render();break;
    case 'fullscreen':if(window!==window.top){try{window.parent.postMessage('lh-fullscreen','*')}catch(e){}break}
      document.documentElement.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{}).finally(()=>render());break;
    case 'tutorial':{const on=tutorialPref()!=='on';try{localStorage.setItem('the-last-hour-tutorial',on?'on':'off');if(on) localStorage.removeItem(TIP_KEY)}catch(e){}render();break}
    case 'settings':ui.modal={kind:'settings'};render();break;
    case 'daily':{const d=todayStr();ui.modal=null;ART.clear();newRun(null,{code:dailyCode(d),daily:d});break}
    case 'seedenter':ui.modal={kind:'seed'};render();setTimeout(()=>{const i=document.querySelector('.seedin');if(i) i.focus()},50);break;
    case 'shareseed':shareSeed();break;
    case 'cutscenes':{try{localStorage.setItem('the-last-hour-cutscenes',cinePref()==='on'?'off':'on')}catch(e){}render();break}
    case 'motion':{const n={auto:'on',on:'off',off:'auto'}[motionPref()];try{localStorage.setItem('the-last-hour-motion',n)}catch(e){}applyMotion();render();break}
    case 'enter':S.screen='play';S.boon={left:((S.boon&&S.boon.left)||0)+1,offer:null,start:true};openBoon();save();render();window.scrollTo(0,0);break;   // every era opens with a relic pick
    case 'tab':ui.tab=b.dataset.tab;render();window.scrollTo(0,0);break;
    case 'mem':{const f=+b.dataset.f;if(S.era.pos[f]==null){ui.sheet={f};render()}else openMemory(S.era.pos[f])}break;
    case 'sketch':ui.sketch=+b.dataset.i;render();break;
    case 'zoom':ui.zoom=ui.zoom===2?1:2;render();break;
    case 'memi':openMemory(+b.dataset.i);break;
    case 'memskip':clearTimeout(ui.memT);ui.mem.shown=S.era.scenes[ui.mem.i].audio.length;render();break;
    case 'memscene':ui.mem.phase='scene';render();{const el=document.querySelector('.memory');if(el) el.scrollTop=0}break;
    case 'memreplay':ui.mem={i:ui.mem.i,phase:'audio',shown:0};render();ui.memT=setTimeout(tickMem,500);break;
    case 'cinenext':if(PHONE_LS.matches&&e.clientX<innerWidth/2){if(ui.cine.k>0){ui.cine.k--;clearTimeout(ui.cineT);render();if(!ui.cine.paused) ui.cineT=setTimeout(tickCine,beatDur())}break}
      if(ui.cine.paused){if(ui.cine.k>=cineBeats().length-1) endCine();else{ui.cine.k++;render()}}else tickCine();break;
    case 'cinepause':ui.cine.paused=!ui.cine.paused;clearTimeout(ui.cineT);if(!ui.cine.paused) ui.cineT=setTimeout(tickCine,beatDur());render();break;
    case 'cineseek':ui.cine.k=+b.dataset.k;clearTimeout(ui.cineT);render();if(!ui.cine.paused) ui.cineT=setTimeout(tickCine,beatDur());break;
    case 'cineskip':endCine();break;
    case 'replay':openMemory(+b.dataset.i,true);break;
    case 'closemem':clearTimeout(ui.memT);ui.mem=null;ui.backFromMem=true;render();break;
    case 'face':if(ui.modal&&ui.modal.kind==='chart') ui.modal=null;ui.sheet=ui.mem?{f:+b.dataset.f,t:'notes'}:{f:+b.dataset.f};   // mid-memory you're collecting clues
     ui.notesNot=false;render();break;
    case 'closesheet':ui.sheet=null;render();break;
    case 'closemodal':{const wasMsg=ui.modal&&ui.modal.kind==='msg';ui.modal=null;if(wasMsg&&S&&S.boon&&S.boon.left>0) openBoon();render();break}
    case 'pickboon':pickBoon(b.dataset.id);break;
    case 'rerollboon':S.run.charges.slate--;S.boon.offer=makeOffer({noInstant:S.screen!=='play'});save();render();break;
    case 'place':applyPlace(b.dataset.p);break;
    case 'openboon':openBoon();render();break;
    case 'clear':{const a=S.era.assign[+b.dataset.f];a.c=null;a.cause=null;a.k=null;save();render();break}
    case 'consult':consult();break;
    case 'chart':ui.modal={kind:'chart',f:b.dataset.f!=null?+b.dataset.f:null};render();break;
    case 'debugsolve':debugSolve(+b.dataset.f);break;
    case 'debugall':debugFillAll();break;
    case 'debugtwo':debugSolveTwo();break;
    case 'sortcycle':{const i=SORTS.indexOf(ui.sort||'num-asc');ui.sort=SORTS[(i+1)%SORTS.length];ui.deadPage=0;ui.tab='gather';render();const g=document.querySelector('.pgrid');if(g) g.scrollLeft=0;break}
    case 'deadpage':ui.deadPage=+b.dataset.p;render();break;
    case 'tool':useTool(b.dataset.id);break;
    case 'map':ui.modal={kind:'map',d:+b.dataset.d};render();break;
    case 'mtarget':applyMend(ui.modal.tool,+b.dataset.c);break;
    case 'target':applyTarget(ui.modal.tool,+b.dataset.f);break;
    case 'toreward':S.offer=makeOffer({noInstant:true});S.screen='reward';save();render();window.scrollTo(0,0);break;
    case 'win':S.screen='end';S.won=true;save();render();window.scrollTo(0,0);break;
    case 'pick':takeReward(b.dataset.id);break;
    case 'reroll':S.run.charges.slate--;S.offer=makeOffer({noInstant:true});save();render();break;
    case 'abandon':ui.modal={kind:'abandon'};render();break;
    case 'confirmabandon':ui.modal=null;clearSave();S=null;render();window.scrollTo(0,0);break;
  }
});
/* one place that records an answer: kind is name | cause | killer */
function setAnswer(f,kind,v){
  const a=S.era.assign[f];
  if(kind==='name'){const n=v==null?null:+v;if(n!=null) S.era.assign.forEach((x,i)=>{if(i!==f&&x.c===n) x.c=null});a.c=n}
  else if(kind==='cause'){a.cause=v;if(!needsKiller(v)) a.k=null;else if(isEither(v)&&a.k==null) a.k='acc'}   // accident unless changed
  else a.k=v==null?null:(v==='acc'?'acc':+v);
  save();render();
}
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-change]');if(!s||!S) return;
  setAnswer(+s.dataset.f,s.dataset.change,s.value===''?null:s.value);
});
document.addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('.cnin')) return;
  if(DESK&&S&&S.screen==='play'&&ui.tab==='gather'&&!ui.mem&&!ui.cine&&!ui.pick&&!ui.modal&&!ui.sheet&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const n=Math.ceil(S.era.n/12),p=(ui.deadPage||0)+(e.key==='ArrowRight'?1:-1);if(p>=0&&p<n){ui.deadPage=p;render()}return}if(ui.cine&&(e.key===' '||e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();tickCine();return}if(e.key==='Escape'&&ui.cine){endCine();return}if(e.key==='Escape'){if(ui.pick) ui.pick=null;else if(ui.sheet) ui.sheet=null;else if(ui.modal&&ui.modal.kind!=='msg'&&ui.modal.kind!=='boon') ui.modal=null;else if(ui.mem){clearTimeout(ui.memT);ui.mem=null}render()}});
/* custom notes: submit from the Add button or the keyboard's Enter/Done key */
/* the memory's Notes tab pulses after a while if this memory holds a clue about its own person that could be tagged
   and they have no tag of that kind yet (voice -> homeland, role -> role, family -> related to, name or monogram -> name) */
const NOTE_PULSE_MS=20000,HINT_TAG={origin:'home',role:'role',kin:'rel',name:'name',initials:'name'};
const KIN_WORDS=['My husband','My wife','Brother','Sister','My son','My daughter','Father','Mother'];
/* the sentences of memory i that carry a clue of type t about face f (so crossing them all out settles the clue) */
function hintBeats(i,f,t){const era=S.era,s=era.scenes[i],E=E_(),c=era.chars[era.f2c[f]],F=`{F${f}}`,b=s.beats||[];
  const has=(x,y)=>x.includes(F)&&(!y||x.includes(y));let test;
  if(t==='role') test=x=>has(x,roleOf(E,c.role).tell);
  else if(t==='origin'){const o=E.origins[c.origin];test=x=>has(x,o.L||o.A)}
  else if(t==='name') test=x=>x.includes(c.first+'!');
  else if(t==='initials'){const tg=(s.tags||[]).find(g=>g.f===f&&g.kind==='initials');test=x=>tg&&x.includes(tg.label.replace(/”\.?$/,'').slice(-6))}
  else if(t==='kin') test=x=>has(x)&&KIN_WORDS.some(w=>x.includes('“'+w));
  else return [];
  return b.map((x,k)=>test(x)?k:-1).filter(k=>k>=0)}
function needsNote(i){const era=S.era,s=era&&era.scenes[i];if(!s||era.sealed[s.victim]) return false;   // solved people never pulse
  const f=s.victim,p=pnote(f),hs=(s.hints||[]).concat((s.tags||[]).map(t=>({f:t.f,t:t.kind==='initials'?'initials':t.kind==='role'?'role':null})));
  const crossed=h=>{const bs=hintBeats(i,f,h.t);return bs.length>0&&bs.every(k=>(era.marks||{})[i+':'+k]==='x')};
  return hs.some(h=>h.f===f&&HINT_TAG[h.t]&&!p[HINT_TAG[h.t]].some(v=>!tagNeg(v))&&!crossed(h))}
/* the delay only counts while the memory's text is on screen (phones: the Memory tab; desktop: always) and the app is open */
function notesPulseCheck(){const key=S&&S.era&&ui.mem&&!ui.cine?ui.mem.i:null;
  if(key===ui._pk) return;ui._pk=key;clearInterval(ui._pT);ui.notesPulse=null;if(key==null) return;
  let spent=0;
  ui._pT=setInterval(()=>{
    if(!ui.mem||ui.mem.i!==key){clearInterval(ui._pT);return}
    if(ui.cine||document.hidden||!(DESK||(ui.memTab||'story')==='story')) return;
    spent+=1000;if(spent<NOTE_PULSE_MS) return;
    clearInterval(ui._pT);if(!needsNote(key)) return;
    ui.notesPulse=key;ui.notesPulsed=null;document.querySelectorAll('.memory .mt[data-t="notes"]').forEach(b=>b.classList.add('npulse'));
    setTimeout(()=>{if(typeof tutorialCheck==='function') tutorialCheck()},600);   // the first time: a tutorial tip says why
    setTimeout(()=>{if(ui.notesPulse===key) ui.notesPulsed=key},3700)},1000)}   // after the two pulses, redraws show only the solid border
/* phones: the mark buttons in the memory's bottom row line up exactly with the page dots above them */
function alignMarks(){const g=document.querySelector('.memory .memnav .markbtns');if(!g||DESK) return;g.style.transform='';
  const d=document.querySelector('.memory .mtab.on .pdots')||document.querySelector('.memory .mtab.on');if(!d) return;
  const a=d.getBoundingClientRect(),b=g.getBoundingClientRect();if(!a.width||!b.width) return;
  const dx=Math.round((a.left+a.right)/2-(b.left+b.right)/2);if(dx&&Math.abs(dx)<30) g.style.transform=`translateX(${dx}px)`}
/* on touch screens, lift the note box above the keyboard while typing in it */
const KB_TOUCH=matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(any-pointer:fine)').matches);
function kbCheck(){const a=document.activeElement;document.documentElement.classList.toggle('kbtyping',KB_TOUCH&&!!(a&&a.classList&&a.classList.contains('cnin')))}
document.addEventListener('focusin',kbCheck);document.addEventListener('focusout',()=>setTimeout(kbCheck,0));
document.addEventListener('submit',e=>{const fm=e.target.closest('.cnadd');if(!fm) return;e.preventDefault();addNote(+fm.dataset.f,fm.querySelector('.cnin'))});
document.addEventListener('input',e=>{if(e.target.matches('.gnin')){ui.gDraft=Object.assign({},ui.gDraft,{v:e.target.value});return}if(e.target.matches('.cnin')) ui.noteDraft={f:+e.target.dataset.f,v:e.target.value}});
document.addEventListener('click',e=>{
  if(!ui.markMode||!ui.mem||!S||!S.era) return;
  const sp=e.target.closest('.memory .snt');if(!sp) return;
  e.preventDefault();e.stopPropagation();   // a name chip or a place inside the sentence doesn't open while marking
  const era=S.era,k=ui.mem.i+':'+sp.dataset.b,marks=era.marks=era.marks||{},md=ui.markMode;
  if(marks[k]===md) delete marks[k];else marks[k]=md;
  sp.classList.remove('mk-h','mk-x');if(marks[k]) sp.classList.add('mk-'+marks[k]);
  if(ui.notesPulse===ui.mem.i&&!needsNote(ui.mem.i)){ui.notesPulse=null;document.querySelectorAll('.memory .mt.npulse').forEach(b=>b.classList.remove('npulse','ndone'))}
  save();
},true);
document.addEventListener('submit',e=>{const fm=e.target.closest('.seedform');if(!fm) return;e.preventDefault();
  const code=cleanCode(fm.querySelector('.seedin').value);if(code.length<4){toast('That seed doesn’t look right.');return}
  ui.modal=null;ART.clear();newRun(null,{code,shared:true})});
document.addEventListener('submit',e=>{const fm=e.target.closest('.gnadd');if(!fm) return;e.preventDefault();
  const t=fm.querySelector('.gnin').value.trim().slice(0,GNOTE_LEN),c=ui.gDraft&&ui.gDraft.c!=null&&ui.gDraft.c!==''?ui.gDraft.c:'';if(!t) return;
  const notes=S.era.gnotes=S.era.gnotes||[];if(notes.length>=GNOTE_MAX) return;notes.push({c:c===''?null:+c,t});ui.gDraft=null;save();render()});
// pressing Add must not blur the box first: on phones that closes the keyboard, the layout jumps and the tap misses the button
document.addEventListener('pointerdown',e=>{if(e.target.closest('.cnbtn')&&document.activeElement&&document.activeElement.matches('.cnin')) e.preventDefault()});
/* boot */
(function(){const saved=load();S=null;if(saved&&saved.screen==='end') clearSave();
  const q=new URLSearchParams(location.search),code=cleanCode(q.get('seed'));
  if(code.length>=4){ui.modal={kind:'seed',link:true,code,gv:q.get('gv')};try{const u=new URL(location.href);u.searchParams.delete('seed');u.searchParams.delete('gv');history.replaceState(null,'',u.href);if(window.top!==window){const t=new URL(window.top.location.href);t.searchParams.delete('seed');t.searchParams.delete('gv');window.top.history.replaceState(null,'',t.href)}}catch(e){}}
  render()})();
